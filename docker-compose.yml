services:
  postgres:
    image: postgres:16-alpine
    container_name: mymita-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mymita}
      POSTGRES_USER: ${POSTGRES_USER:-mymita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mymita_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mymita} -d ${POSTGRES_DB:-mymita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mymita-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mymita}
      DB_USER: ${POSTGRES_USER:-mymita}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mymita_secret_dev}
      JWT_SECRET: ${JWT_SECRET:-MyMitaSuperSecretKeyForJwtSigning2026Minimum256BitsLong!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mymita-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
