server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: mymita-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mymita:
  jwt:
    secret: ${JWT_SECRET:MyMitaSuperSecretKeyForJwtSigning2026Minimum256BitsLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  payment:
    provider: ${PAYMENT_PROVIDER:sandbox}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:mymita_sandbox_webhook_secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
